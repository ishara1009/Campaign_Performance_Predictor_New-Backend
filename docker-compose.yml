version: "3.9"

services:
  backend:
    build: .
    container_name: campaign_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PYTHON_PATH=python3
    volumes:
      # Persist uploaded files across container restarts
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads_data:
